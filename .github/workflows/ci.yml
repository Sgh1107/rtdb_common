# rtdb_common CI（M0 里程碑"CI 就绪"出口项）
# 双平台矩阵构建 + 单测。测试入口统一从 build/ 目录执行 ctest
# （历史教训：在源码根目录执行会得到零用例的空跑记录，见 README 提醒）。
#
# 注意：Windows 不固定 VS 生成器版本 —— GitHub 已将 windows-latest 镜像
# 默认切换到 VS 2026（runner-images #14016），固定 "Visual Studio 17 2022"
# 会报 could not find any instance of Visual Studio。由 CMake 自动探测
# 镜像上最新安装的 VS 版本，跨镜像迁移更稳健。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # MSVC（自动探测最新版）：Win32 平台层验证
          - os: ubuntu-latest    # GCC：POSIX 平台层验证（ftruncate/mmap、/proc 活性检测）
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests (from build dir!)
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-${{ matrix.os }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
