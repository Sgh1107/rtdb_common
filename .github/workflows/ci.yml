# rtdb_common CI（M0 里程碑"CI 就绪"出口项）
# 双平台矩阵构建 + 单测。测试入口统一从 build/ 目录执行 ctest
# （历史教训：在源码根目录执行会得到零用例的空跑记录，见 README 提醒）。
#
# 注意：Windows 不固定 VS 生成器版本 —— GitHub 已将 windows-latest 镜像
# 默认切换到 VS 2026（runner-images #14016），固定 "Visual Studio 17 2022"
# 会报 could not find any instance of Visual Studio。由 CMake 自动探测
# 镜像上最新安装的 VS 版本，跨镜像迁移更稳健。
#
# 辅助 job（docs/05 D2 / docs/06 §4 / docs/12 §7.2 A4）：
#   sanitize —— Linux ASan+UBSan 插桩构建与单测（UBSan 出错即中止）；
#   tsan     —— Linux TSan 数据竞争探测（stores 句柄缓存并发首访等）；
#   coverage —— Linux 覆盖率度量（gcovr，仅统计 src/ 内核代码）。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # MSVC（自动探测最新版）：Win32 平台层验证
          - os: ubuntu-latest    # GCC：POSIX 平台层验证（ftruncate/mmap、/proc 活性检测）
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests (from build dir!)
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-${{ matrix.os }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  sanitize:
    # ASan（含 LeakSanitizer）+ UBSan：共享内存 offset 寻址类代码是
    # 内存问题高发区，M0 起每次提交都跑一遍（docs/05 D2 / docs/06 §1）。
    name: sanitize-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (ASan + UBSan)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j

      - name: Unit tests (ASan + UBSan instrumented)
        working-directory: build
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --output-on-failure

      - name: Upload sanitizer log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  tsan:
    # TSan：线程数据竞争探测（docs/12 §7.2 修复冲刺 A4；MSVC 无 TSan，
    # 故由 Linux 作业承担）。焦点是 Engine 读路径在根锁之外访问的共享
    # 状态（stores 句柄缓存等）与新增并发回归用例
    # （tests/unit/test_concurrency.cpp）。已知边界：TSan 不跨进程跟踪，
    # 依赖纯跨进程同步的用例（shm 互斥的多进程侧）不在覆盖范围内。
    name: tsan-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (TSan)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build -j

      - name: Unit tests (TSan instrumented)
        working-directory: build
        env:
          TSAN_OPTIONS: halt_on_error=1:history_size=7
        run: ctest --output-on-failure

      - name: Upload TSan log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  coverage:
    # 覆盖率度量：仅统计 src/ 内核代码（排除 _deps/googletest 与 tests/），
    # 结果作为 docs/06 §4 "infra/engine ≥85%" 验收口径的证据。
    name: coverage-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pipx install gcovr

      - name: Configure (--coverage)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=--coverage

      - name: Build
        run: cmake --build build -j

      - name: Unit tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Coverage summary
        run: >
          gcovr --root . --filter 'src/' --exclude '_deps' --print-summary
          --fail-under-line 80
          --gcov-ignore-parse-errors=negative_hits.warn_once_per_file

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
